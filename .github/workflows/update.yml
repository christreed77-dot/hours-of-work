# The "alarm clock". Every morning GitHub runs this: fetch fresh data -> rebuild data.json -> publish to Cloudflare.
name: Update data and deploy

on:
  schedule:
    - cron: "17 13 * * *"      # every day at 13:17 UTC (6:17 AM Mountain / 5:17 AM Pacific)
  workflow_dispatch:           # also gives you a "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write              # lets the job save the refreshed data.json back to the repo

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests (offline, uses fake data)
        run: python tests/test_build.py

      - name: Fetch real data and compute labor hours
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}     # optional: lets a failed source fall back to yesterday's numbers
        run: python scripts/build_data.py --out site/data.json

      - name: Save data.json to the repo (keeps a history, keeps the schedule alive)
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "Update data [skip ci]" && git push)

      - name: Publish to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
